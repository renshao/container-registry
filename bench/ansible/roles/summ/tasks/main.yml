---
# Build summ from the operator's working tree and render one systemd unit per
# selected summ engine.
#
# The source is rsync'd rather than cloned so a run measures work in progress,
# which is the point during development. summ_src_rev records what was actually
# built, so a report is attributable to specific code.

- name: Select the summ engines for this run
  ansible.builtin.set_fact:
    summ_engines: "{{ selected_engines | selectattr('kind', 'eq', 'summ') | list }}"

# Two ways to get a summ binary onto the VM, and exactly one runs.
#
#   summ_release set  -> download that GitHub release tag. This is what you want
#                        when the question is "how does the shipped artifact
#                        behave": no toolchain, no ~10 min RocksDB compile, and
#                        the bytes under test are the bytes users download.
#   summ_release unset -> build the operator's working tree, so a run measures
#                        work in progress. This is the original behaviour.
- name: Decide how summ is installed
  ansible.builtin.set_fact:
    summ_from_release: "{{ (summ_release | default('')) | length > 0 }}"

- name: Show the summ install mode
  ansible.builtin.debug:
    msg: >-
      {{ summ_from_release | ternary('release ' ~ (summ_release | default('')),
                                     'source build from ' ~ (summ_src | default('?'))) }}
  when: summ_engines | length > 0

# ---------------------------------------------------------------- release path
- name: Download and verify the summ release
  # The published .sha256 is checked before the tarball is unpacked, matching
  # what the distribution role does for its own release.
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    TAG="{{ summ_release }}"
    case "$(uname -m)" in
      x86_64)  TRIPLE=x86_64-unknown-linux-gnu ;;
      aarch64) TRIPLE=aarch64-unknown-linux-gnu ;;
      *) echo "ERROR: unsupported architecture $(uname -m)" >&2; exit 1 ;;
    esac
    BASE="https://github.com/summcr/summ/releases/download/${TAG}"
    TARBALL="summ-${TRIPLE}.tar.gz"
    cd "$(mktemp -d)"
    curl -fsSL -O "${BASE}/${TARBALL}"
    curl -fsSL -O "${BASE}/${TARBALL}.sha256"
    expected=$(awk '{print $1}' "${TARBALL}.sha256")
    actual=$(sha256sum "${TARBALL}" | awk '{print $1}')
    if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
      echo "ERROR: checksum mismatch for ${TARBALL}" >&2
      echo "  expected: ${expected:-<empty>}" >&2
      echo "  actual:   ${actual}" >&2
      exit 1
    fi
    tar xzf "${TARBALL}"
    install -m 0755 summ /usr/local/bin/summ
    /usr/local/bin/summ --version
  args:
    executable: /bin/bash
  register: summ_release_install
  changed_when: true
  when:
    - summ_engines | length > 0
    - summ_from_release

- name: Show the installed summ version
  ansible.builtin.debug:
    msg: "{{ summ_release_install.stdout_lines | last }}"
  when:
    - summ_engines | length > 0
    - summ_from_release

# ----------------------------------------------------------------- source path

- name: Install summ build prerequisites
  # clang and lld are what librocksdb-sys needs: it compiles RocksDB from source
  # and runs bindgen. This mirrors summ's own CI (.github/workflows/ci.yml).
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - clang
      - lld
      - pkg-config
      - libssl-dev
    state: present
    update_cache: true
  when:
    - summ_engines | length > 0
    - not summ_from_release

- name: Install rustup
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
      | sh -s -- -y --default-toolchain stable --profile minimal
  args:
    executable: /bin/bash
    creates: "/home/{{ ansible_user }}/.cargo/bin/cargo"
  when:
    - summ_engines | length > 0
    - not summ_from_release

- name: Sync the summ source tree to the VM
  become: false
  ansible.posix.synchronize:
    src: "{{ summ_src }}/"
    dest: "{{ summ_remote_dir }}/"
    delete: true
    rsync_opts:
      # An excluded path is also protected from --delete (rsync only removes
      # excluded files under --delete-excluded, which synchronize never passes).
      # So this both keeps target/ off the wire and leaves the remote build
      # cache intact — which is what saves a repeat run from recompiling
      # RocksDB. An explicit protect filter is redundant, and the long-form
      # rule is not portable across the rsync on the controller.
      - "--exclude=target"
      - "--exclude=.git"
  when:
    - summ_engines | length > 0
    - not summ_from_release

- name: Build summ in release mode
  become: false
  ansible.builtin.shell: |
    set -euo pipefail
    export PATH="$HOME/.cargo/bin:$PATH"
    cargo build --release -p summ-server
  args:
    chdir: "{{ summ_remote_dir }}"
    executable: /bin/bash
  register: summ_build
  changed_when: "'Compiling' in summ_build.stderr or 'Compiling' in summ_build.stdout"
  when:
    - summ_engines | length > 0
    - not summ_from_release

- name: Install the summ binary
  become: true
  ansible.builtin.copy:
    src: "{{ summ_remote_dir }}/target/release/summ"
    dest: /usr/local/bin/summ
    remote_src: true
    mode: "0755"
  when:
    - summ_engines | length > 0
    - not summ_from_release

- name: Record the summ revision that was built
  become: true
  ansible.builtin.copy:
    dest: /etc/bench-registry/summ.version
    content: "{{ summ_from_release | ternary(summ_release | default(''), summ_src_rev | default('unknown')) }}\n"
    mode: "0644"
  when: summ_engines | length > 0

- name: Render a systemd unit per summ engine
  become: true
  ansible.builtin.template:
    src: unit.service.j2
    dest: "/etc/systemd/system/{{ engine.unit }}"
    mode: "0644"
  loop: "{{ summ_engines }}"
  loop_control:
    loop_var: engine
    label: "{{ engine.unit }}"
  notify: reload systemd

- name: Apply unit changes now
  ansible.builtin.meta: flush_handlers

- name: Leave every summ engine stopped and disabled
  become: true
  ansible.builtin.systemd:
    name: "{{ engine.unit }}"
    state: stopped
    enabled: false
  loop: "{{ summ_engines }}"
  loop_control:
    loop_var: engine
    label: "{{ engine.unit }}"
